<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Studio</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #15151c;
      border: 1px solid #292933;
      border-radius: 24px;
      padding: 24px;
      text-align: center;
    }

    h1 { margin: 0 0 8px; }

    .subtitle {
      color: #a5a5b5;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .camera-box {
      background: #050507;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #placeholder {
      color: #777784;
      font-size: 14px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .secondary {
      background: #292933;
      color: white;
    }

    #status {
      margin-top: 16px;
      color: #a5a5b5;
      font-size: 13px;
    }

    canvas { display: none; }

    #download {
      display: none;
      margin-top: 16px;
      color: #8ab4ff;
      text-decoration: none;
      font-size: 14px;
    }

    .notice {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #20202a;
      color: #aaaab8;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Camera Studio</h1>

    <p class="subtitle">
      Your camera will only be used after you give permission.
    </p>

    <div class="camera-box">
      <video id="video" autoplay playsinline></video>
      <div id="placeholder">Camera is off</div>
    </div>

    <div class="buttons">
      <button id="startBtn" onclick="startCamera()">Start Camera</button>
      <button id="stopBtn" class="secondary" onclick="stopCamera()" disabled>Stop</button>
    </div>

    <button id="captureBtn" onclick="capturePhoto()" disabled>
      Capture Photo
    </button>

    <canvas id="canvas"></canvas>

    <a id="download" download="photo.png">Save Captured Photo</a>

    <div id="status">Camera is off</div>

    <div class="notice">
      🔒 Privacy: This demo does not upload or secretly access your camera.
      You can stop the camera at any time.
    </div>
  </div>

  <script>
    let stream = null;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const captureBtn = document.getElementById("captureBtn");
    const download = document.getElementById("download");
    const status = document.getElementById("status");
    const placeholder = document.getElementById("placeholder");

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;
        video.style.display = "block";
        placeholder.style.display = "none";

        startBtn.disabled = true;
        stopBtn.disabled = false;
        captureBtn.disabled = false;

        status.textContent = "Camera is active";
      } catch (error) {
        status.textContent =
          "Camera permission was denied or unavailable.";
        console.error(error);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
      video.style.display = "none";
      placeholder.style.display = "block";

      startBtn.disabled = false;
      stopBtn.disabled = true;
      captureBtn.disabled = true;

      status.textContent = "Camera is off";
    }

    function capturePhoto() {
      if (!stream) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const context = canvas.getContext("2d");
      context.drawImage(video, 0, 0);

      download.href = canvas.toDataURL("image/png");
      download.style.display = "inline-block";
      download.textContent = "Save Captured Photo";

      status.textContent = "Photo captured";
    }
  </script>

</body>
</html>
